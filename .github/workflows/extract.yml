name: Extract Barnhill App
on: workflow_dispatch
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and replace app code
        run: |
          rm -rf app/src/main/java app/src/main/res app/src/main/AndroidManifest.xml
          unzip -o BarnhillCalendar_Fixed.zip -d /tmp/barnhill
          # Find the main folder inside zip (could be nested)
          MAIN_PATH=$(find /tmp/barnhill -type d -name "main" | head -n 1)
          echo "Found main at $MAIN_PATH"
          cp -r $MAIN_PATH/* app/src/main/
          ls -R app/src/main
      - name: Commit replaced files
        run: |
          git config user.name "Brent Barnhill"
          git config user.email "brent@barnhill.com"
          git add app/src/main/
          git commit -m "Replace with Barnhill Calendar app" || echo "No changes"
          git push
