name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip
        run: |
          rm -rf app/src/main/java app/src/main/res app/src/main/AndroidManifest.xml
          unzip -o BarnhillCalendar_Fixed.zip -d /tmp/b
          MAIN=$(find /tmp/b -name AndroidManifest.xml -exec dirname {} \; | head -n 1)
          cp -rv $MAIN/* app/src/main/
          ls app/src/main/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BarnhillCalendar-APK
          path: app/build/outputs/apk/debug/*.apk
