name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AUTO-EXTRACT zip
        run: |
          if [ -f BarnhillCalendar_Fixed.zip ]; then
            rm -rf app/src/main/java app/src/main/res app/src/main/AndroidManifest.xml
            unzip -o BarnhillCalendar_Fixed.zip -d /tmp/barnhill
            MAIN_PATH=$(find /tmp/barnhill -name "AndroidManifest.xml" -exec dirname {} \; | head -n 1)
            cp -rv $MAIN_PATH/* app/src/main/
          fi
          ls -R app/src/main/
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BarnhillCalendar-APK
          path: app/build/outputs/apk/debug/*.apk
